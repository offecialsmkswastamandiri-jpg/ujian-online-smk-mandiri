    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:white;font-weight:650}button.secondary{background:#e8eef7;color:var(--navy)}button.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}label{display:grid;gap:6px;color:#334155;font-size:13px;font-weight:650}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:3px 9px;background:#e0eaf7;color:#1d4f91;font-size:12px;font-weight:700}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:white;padding:22px 15px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}.brand-icon{width:42px;height:42px;border-radius:12px;background:#ffffff1c;display:grid;place-items:center;font-size:22px}.brand strong{display:block;font-size:15px}.brand span{font-size:11px;color:#dbeafe}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#dce8f7;text-align:left;display:flex;gap:10px;align-items:center;font-weight:550}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff}.sidebar-footer{margin-top:auto;border-top:1px solid #ffffff30;padding:15px 8px;font-size:12px;color:#dbeafe}.main{min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.topbar h1{font-size:18px;margin:0}.topba ntent:center}.login-hero h1{font-size:clamp(32px,4vw,52px);line-height:1.08;margin:25px 0 15px;max-width:600px}.login-hero p{color:#dbeafe;max-width:480px}.hero-mark{width:62px;height:62px;border-radius:18px;background:#ffffff1b;display:grid;place-items:center;font-size:32px}.login-box{display:grid;place-items:center;padding:25px}.login-card{width:min(410px,100%);padding:20px}.login-card h2{margin:0 0 7px}.login-card form{display:grid;gap:15px;margin-top:25px}.login-card .logo-text{font-size:12px;color:var(--muted);margin-top:25px}.mobile-menu{display:none}.toast{position:fixed;right:22px;bottom:22px;z-index:10;max-width:min(440px,calc(100vw - 44px));padding:14px 18px;border-radius:12px;background:#102e50;color:white;box-shadow:0 12px 35px #0002}.question-preview{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap}.badge-row{display:flex;flex-wrap:wrap;gap:6px}.dropzone{border:1.5px dashed #94a3b8;border-radius:12px;padding:20px;text-align:center}.actions{display:flex;gap:7px;flex-wrap:wrap}
